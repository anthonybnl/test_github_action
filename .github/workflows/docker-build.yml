name: pipeline_docker_build
env:
  IMAGE_NAME: user/app:latest
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "bonjour"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build BUT DO NOT PUSH
        uses: docker/build-push-action@v7
        with:
          push: false
          tags: ${{ env.IMAGE_NAME }}
      - name: Lancement de l'image
        run: docker run --rm ${{ env.IMAGE_NAME }} 13 7
