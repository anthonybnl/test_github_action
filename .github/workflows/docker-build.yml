name: pipeline_docker_build
env:
  IMAGE_NAME: user/app:latest
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Build BUT DO NOT PUSH
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: localhost:5000/${{ env.IMAGE_NAME }}
          
      - name: Lancement de l'image
        run: docker run --rm localhost:5000/${{ env.IMAGE_NAME }} 13 7
